name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') }}  # GUARD-LINE
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing / provenance
    steps:
      - uses: actions/checkout@v4   # no ref: — takes the dispatched ref
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # OIDC exchange needs a recent npm
      - run: npm ci || npm install --no-package-lock
      - name: Publish to npm
        run: |
          NAME=$(jq -r '.name' package.json)
          VER=$(jq -r '.version' package.json)
          if npm view "$NAME" versions --json 2>/dev/null | jq -e --arg v "$VER" 'index($v)' >/dev/null; then
            echo "published   = false ($NAME@$VER already exists)"
          else
            npm publish --provenance --access public
            echo "published   = true ($NAME@$VER)"
          fi
      - name: Report
        if: always()
        run: |
          echo "event_name  = ${{ github.event_name }}"
          echo "ref         = ${{ github.ref }}"
